name: skill-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate skill structure and links
        run: python3 scripts/lint_skills.py
      - name: Checkout pinned TRACE evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: full-stack-skills/agent-skills
          ref: 91cd3e8e2aafd73d73fc037ce75dee7b6b663ffb
          path: .trace-evaluator
          persist-credentials: false
      - name: Enforce TRACE score floor
        run: python3 scripts/trace_gate.py --evaluator .trace-evaluator/skills/skill-trace-evaluation/scripts/trace_evaluate.py --threshold 4.5
